# Langue par défaut : français. Apostrophe doublée ('') car always-use-message-format=true.
# Arguments : {0} = prénom dans common.greeting ; {0} = code dans mfa-code.subject.

common.brand=KickOff Matchup
common.footer=Cet email a été envoyé automatiquement, merci de ne pas y répondre.
common.greeting=Bonjour {0},
common.ignore=Si vous n''êtes pas à l''origine de cette demande, ignorez cet email.

verify-email.subject=Confirmez votre adresse email
verify-email.body=Pour activer votre compte, cliquez sur le lien ci-dessous (valable 24 h) :
verify-email.cta=Confirmer mon adresse email

password-reset.subject=Réinitialisation de votre mot de passe
password-reset.body=Pour choisir un nouveau mot de passe, cliquez sur le lien ci-dessous (valable 1 h) :
password-reset.cta=Réinitialiser mon mot de passe
password-reset.ignore=Si vous n''avez rien demandé, ignorez cet email : votre mot de passe reste inchangé.

mfa-code.subject=Votre code de connexion : {0}
mfa-code.body=Votre code de vérification est :
mfa-code.validity=Il est valable 5 minutes. Ne le communiquez à personne.
mfa-code.ignore=Si vous n''êtes pas à l''origine de cette connexion, changez votre mot de passe.

account-already-exists.subject=Vous avez déjà un compte
account-already-exists.body=Quelqu''un vient d''essayer de créer un compte avec cette adresse, qui en a déjà un.
account-already-exists.hint=Connectez-vous normalement (avec Google si c''est ce que vous utilisez), ou utilisez « Mot de passe oublié » pour définir un mot de passe.

email-change.subject=Confirmez votre nouvelle adresse email
email-change.body=Vous avez demandé à utiliser cette adresse pour votre compte KickOff Matchup. Pour confirmer, cliquez sur le lien ci-dessous (valable 24 h) :
email-change.cta=Confirmer ma nouvelle adresse
email-change.ignore=Si vous n''êtes pas à l''origine de cette demande, ignorez cet email : l''adresse du compte reste inchangée.

email-change-notice.subject=Changement d''adresse email demandé
email-change-notice.body=Un changement de l''adresse email de votre compte vers {0} vient d''être demandé. L''adresse ne changera qu''après confirmation depuis cette nouvelle boîte.
email-change-notice.hint=Si ce n''est pas vous, changez votre mot de passe sans attendre.

set-password.subject=Définissez un mot de passe pour votre compte
set-password.body=Votre compte est actuellement relié à un fournisseur de connexion (comme Google). Pour pouvoir aussi vous connecter avec un mot de passe, choisissez-en un avec le lien ci-dessous (valable 1 h) :
set-password.cta=Définir mon mot de passe
set-password.ignore=Si vous n''êtes pas à l''origine de cette demande, ignorez cet email : votre compte reste inchangé.
