<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="fr" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${title}">Mail</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f5f7; font-family: Arial, Helvetica, sans-serif; color: #222; }
    .card { background: #ffffff; border-radius: 8px; }
    .brand { background: #1b2a41; color: #ffffff; font-size: 20px; font-weight: bold; padding: 20px 32px; }
    .content { padding: 32px; font-size: 16px; line-height: 1.5; }
    .content p { margin: 0 0 16px; }
    .btn { display: inline-block; background: #1f6feb; color: #ffffff !important; text-decoration: none;
           font-weight: bold; padding: 12px 24px; border-radius: 6px; }
    .code { font-size: 32px; letter-spacing: 8px; font-weight: bold; background: #f4f5f7;
            padding: 16px; text-align: center; border-radius: 6px; }
    .muted { color: #666666; font-size: 13px; }
    .footer { padding: 16px 32px; color: #888888; font-size: 12px; text-align: center; }
  </style>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#222;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" class="card"
               style="width:100%;max-width:560px;background:#ffffff;border-radius:8px;">
          <tr><td class="brand" style="background:#1b2a41;color:#ffffff;font-size:20px;font-weight:bold;padding:20px 32px;"
                  th:text="#{common.brand}">KickOff Matchup</td></tr>
          <tr><td class="content" style="padding:32px;font-size:16px;line-height:1.5;" th:insert="${content}">Contenu</td></tr>
        </table>
        <div class="footer" style="padding:16px 32px;color:#888888;font-size:12px;text-align:center;"
             th:text="#{common.footer}">Email automatique</div>
      </td>
    </tr>
  </table>
</body>
</html>
