<h2>{{ keyPrefix + '.title' | translate }}</h2>

<div class="max-w-sm">
  @if (sent()) {
    <nz-alert nzType="success" nzShowIcon [nzMessage]="keyPrefix + '.done' | translate" />
  } @else {
    <p>{{ keyPrefix + '.hint' | translate }}</p>
    @if (error()) {
      <nz-alert nzType="error" nzShowIcon [nzMessage]="error() | translate" />
    }
    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-label nzFor="email">{{ 'common.email' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="fieldError(form.controls.email)">
          <input nz-input id="email" type="email" formControlName="email" autocomplete="email" />
        </nz-form-control>
      </nz-form-item>

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="loading()">{{ keyPrefix + '.button' | translate }}</button>
    </form>
  }
  <p><a routerLink="/auth/login">{{ 'common.backToLogin' | translate }}</a></p>
</div>
