<h2>Nouveau mot de passe</h2>

<div class="max-w-sm">
  @if (done()) {
    <nz-alert
      nzType="success"
      nzShowIcon
      nzMessage="Mot de passe modifié"
      nzDescription="Toutes vos sessions ont été déconnectées. Vous pouvez vous reconnecter."
    />
    <p><a routerLink="/login">Se connecter</a></p>
  } @else if (!token) {
    <nz-alert nzType="error" nzShowIcon nzMessage="Lien invalide." />
    <p><a routerLink="/forgot-password">Demander un nouveau lien</a></p>
  } @else {
    @if (error()) {
      <nz-alert nzType="error" nzShowIcon [nzMessage]="error()" />
      <p><a routerLink="/forgot-password">Demander un nouveau lien</a></p>
    }
    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-label nzFor="newPassword">Nouveau mot de passe</nz-form-label>
        <nz-form-control [nzErrorTip]="fieldError(form.controls.newPassword)">
          <input nz-input id="newPassword" type="password" formControlName="newPassword" autocomplete="new-password" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="confirm">Confirmer</nz-form-label>
        <nz-form-control [nzErrorTip]="fieldError(form.controls.confirm)">
          <input nz-input id="confirm" type="password" formControlName="confirm" autocomplete="new-password" />
        </nz-form-control>
      </nz-form-item>

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="loading()">Changer le mot de passe</button>
    </form>
  }
</div>
