<h2>Créer un compte</h2>

<div class="max-w-sm">
  @if (sent()) {
    <nz-alert
      nzType="success"
      nzShowIcon
      nzMessage="Presque fini !"
      nzDescription="Si cette adresse peut être utilisée, un email de confirmation vient d'être envoyé (lien valable 24 h)."
    />
    <p><a routerLink="/login">Se connecter</a> · <a routerLink="/resend-verification">Email non reçu ?</a></p>
  } @else {
    @if (error()) {
      <nz-alert nzType="error" nzShowIcon [nzMessage]="error()" />
    }
    <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()">
      <nz-form-item>
        <nz-form-label nzFor="firstName">Prénom</nz-form-label>
        <nz-form-control [nzErrorTip]="fieldError(form.controls.firstName)">
          <input nz-input id="firstName" formControlName="firstName" autocomplete="given-name" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="lastName">Nom</nz-form-label>
        <nz-form-control [nzErrorTip]="fieldError(form.controls.lastName)">
          <input nz-input id="lastName" formControlName="lastName" autocomplete="family-name" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="email">Email</nz-form-label>
        <nz-form-control [nzErrorTip]="fieldError(form.controls.email)">
          <input nz-input id="email" type="email" formControlName="email" autocomplete="email" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="password">Mot de passe</nz-form-label>
        <nz-form-control [nzErrorTip]="fieldError(form.controls.password)">
          <input nz-input id="password" type="password" formControlName="password" autocomplete="new-password" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzFor="confirm">Confirmer le mot de passe</nz-form-label>
        <nz-form-control [nzErrorTip]="fieldError(form.controls.confirm)">
          <input nz-input id="confirm" type="password" formControlName="confirm" autocomplete="new-password" />
        </nz-form-control>
      </nz-form-item>

      <button nz-button nzType="primary" nzBlock type="submit" [nzLoading]="loading()">Créer mon compte</button>
    </form>

    <p>Déjà inscrit ? <a routerLink="/login">Se connecter</a></p>
  }
</div>
