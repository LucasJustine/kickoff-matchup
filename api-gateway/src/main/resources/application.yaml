server:
  port : 8080

spring:
    application:
      name : api-gateway
    cloud:
      gateway:
        routes:
          - id: user-service
            uri: http://localhost:8081
            predicates:
            - Path=/users/**
    security:
      oauth2:
        client:
          registration:
            mon-auth-server:
              provider: spring-auth-server
              client-id: api-gateway
              client-secret: secret123
              authorization-grant-type: authorization_code
              scope: openid, profile
          provider:
            spring-auth-server:
              issuer-uri: http://localhost:9000