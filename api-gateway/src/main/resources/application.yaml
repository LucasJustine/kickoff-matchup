server:
  port : 8081
  forward-headers-strategy: native
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}

app:
  frontend-url: ${FRONTEND_URL}
  auth-server-url: ${AUTH_SERVER_URL}
  auth-server-allow-http: ${AUTH_SERVER_ALLOW_HTTP:false}
  auth-server-connect-timeout: 2s
  auth-server-read-timeout: 5s
  jwt:
    issuer: ${JWT_ISSUER}
    audience: kickoffmatchup-api
  rate-limit:
    rules:
      - path: /bff/auth/**
        capacity: 10
        period: 1m
      - path: /mobile/auth/refresh
        capacity: 60
        period: 1m
      - path: /mobile/auth/**
        capacity: 10
        period: 1m

spring:

    application:
      name : api-gateway
    config:
      import: optional:file:.env[.properties]
    lifecycle:
      timeout-per-shutdown-phase: 30s
    session:
      timeout: 30m
    cloud:
      gateway:
        server:
          webmvc:
            routes:
              - id: auth-service-bff
                uri: ${AUTH_SERVER_URL}
                predicates:
                  - Path=/bff/auth/register, /bff/auth/verify-email, /bff/auth/resend-verification, /bff/auth/forgot-password, /bff/auth/reset-password, /bff/auth/me, /bff/auth/me/mfa, /bff/auth/me/password, /bff/auth/me/password-link, /bff/auth/me/delete, /bff/auth/me/email, /bff/auth/confirm-email-change, /bff/auth/mfa/resend
                filters:
                  - RewritePath=/bff/(?<segment>.*), /$\{segment}
              - id: auth-service-mobile
                uri: ${AUTH_SERVER_URL}
                predicates:
                  - Path=/mobile/auth/**
                filters:
                  - RewritePath=/mobile/(?<segment>.*), /$\{segment}
    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:}
        ssl:
          enabled: ${REDIS_SSL:false}

    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
              scope: openid, profile, email
              redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev

server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}

app:
  auth-server-allow-http: true

logging:
  level:
    fr.kickoffmatchup: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
