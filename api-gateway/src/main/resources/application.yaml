server:
  port : 8081
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

app:
  frontend-url: ${FRONTEND_URL:http://localhost}
  auth-server-url: ${AUTH_SERVER_URL:http://localhost:9000}
  jwt:
    issuer: ${JWT_ISSUER:https://auth.kickoffmatchup.fr}
    audience: kickoffmatchup-api
  rate-limit:
    max-requests: 10
    window-seconds: 60

spring:

    application:
      name : api-gateway
    config:
      import: optional:file:.env[.properties]
    session:
      timeout: 30m
    cloud:
      gateway:
        server:
          webmvc:
            routes:
              - id: auth-service-passthrough
                uri: ${AUTH_SERVER_URL:http://localhost:9000}
                predicates:
                  - Path=/bff/auth/register, /bff/auth/verify-email, /bff/auth/resend-verification, /bff/auth/forgot-password, /bff/auth/reset-password, /bff/auth/me, /bff/auth/me/mfa, /bff/auth/mfa/resend
                filters:
                  - RewritePath=/bff/(?<segment>.*), /$\{segment}
    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}

    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID}
              client-secret: ${GOOGLE_CLIENT_SECRET}
              scope: openid, profile, email
              redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    fr.kickoffmatchup: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
