name: kickoff-matchup

services:
  frontend:
    image: node:26-alpine
    container_name: angular-dev
    working_dir: /app
    volumes:
      - ./ui:/app
      - /app/node_modules 
    command: sh -c "npm install && npm run start -- --host 0.0.0.0 --poll 2000"

  proxy:
    image: nginx:alpine
    container_name: nginx-proxy-dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

  kickoff-redis:
    image: redis:7-alpine
    container_name: kickoff-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  user-database:
    image: mysql:latest                      
    container_name: user-database
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${USER_DB_NAME}
      MYSQL_USER: ${USER_DB_USER}
      MYSQL_PASSWORD: ${USER_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - user-database-data:/var/lib/mysql  
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  team-database:
    image: mysql:latest
    container_name: team-database
    environment:
      MYSQL_ROOT_PASSWORD: ${TEAM_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${TEAM_DB_NAME}
      MYSQL_USER: ${TEAM_DB_USER}
      MYSQL_PASSWORD: ${TEAM_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3305:3306"
    volumes:
      - team-database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Serveur mail de DÉVELOPPEMENT : il reçoit tous les mails sans en envoyer aucun.
  # Interface web pour les lire : http://localhost:8025
  kickoff-mail:
    image: axllent/mailpit:latest
    container_name: kickoff-mail
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"           # accepte n'importe quel login/mdp
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"       # authentification sans TLS autorisée (dev)
      MP_DATABASE: /data/mailpit.db          # garde les mails après un redémarrage
    ports:
      - "1025:1025"                          # SMTP
      - "8025:8025"                          # interface web
    volumes:
      - mailpit-data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  auth-server:
    image: maven:3.9-eclipse-temurin-17
    container_name: auth-server
    profiles: ["apps"]
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ${WORKTREES_DIR}/auth-server:/app
      - auth-server-target:/app/target      
      - maven-cache:/root/.m2
    ports:
      - "9000:80"                            # accès direct depuis la machine (debug)
    environment:
      SERVER_PORT: 80                        
      DB_HOST: user-database
      DB_PORT: 3306
      DB_NAME: ${USER_DB_NAME}
      DB_USER: ${USER_DB_USER}
      DB_PASSWORD: ${USER_DB_PASSWORD}
      REDIS_HOST: kickoff-redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_ID}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_PRIVATE_KEY_LOCATION: ${JWT_PRIVATE_KEY_LOCATION:-}
      JWT_PUBLIC_KEY_LOCATION: ${JWT_PUBLIC_KEY_LOCATION:-}
    depends_on:
      user-database:
        condition: service_healthy
      kickoff-redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    image: maven:3.9-eclipse-temurin-17
    container_name: api-gateway
    profiles: ["apps"]
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ${WORKTREES_DIR}/api-gateway:/app
      - api-gateway-target:/app/target
      - maven-cache:/root/.m2
    environment:
      REDIS_HOST: kickoff-redis
      AUTH_SERVER_URL: http://auth-server
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECURE: ${COOKIE_SECURE}
      JWT_ISSUER: ${JWT_ISSUER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "8081:8081"                          # accès direct depuis la machine (debug, Postman) ; nginx passe par le réseau Docker
    depends_on:
      kickoff-redis:
        condition: service_healthy
      auth-server:
        condition: service_started

  mail-service:
    image: maven:3.9-eclipse-temurin-17
    container_name: mail-service
    profiles: ["apps"]
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ${WORKTREES_DIR}/mail_service:/app
      - mail-service-target:/app/target
      - maven-cache:/root/.m2
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MAIL_HOST: kickoff-mail
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      kickoff-mail:
        condition: service_started

volumes:
  auth-server-target:
  api-gateway-target:
  mail-service-target:
  maven-cache:                               # dépendances Maven partagées par les services Spring
  redis-data:
  team-database-data:
  mailpit-data:
  user-database-data:
  rabbitmq-lib:
  rabbitmq-log: