services:
  team-database:
    image: mysql:latest
    container_name: 'team-database'
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_USER: 'team-service-user'
      MYSQL_PASSWORD: 'team-service-password'
      MYSQL_DATABASE: 'team_db'
    ports:
      - '3305:3306'
    volumes:
      - 'team-database-data:/var/lib/mysql'

volumes:
    team-database-data:
      driver: local
      driver_opts:
          type: 'none'
          o: 'bind'
          device: '/E:/Projets/docker/volumes/kickoff-matchup/team'