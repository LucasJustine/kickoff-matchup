server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful

spring:
  application:
    name: auth-server
  config:
    import: optional:file:.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 30s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  datasource:
    # Connexion chiffrée par défaut. Le profil dev remplace cette URL par une version sans TLS.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:user_db}?${DB_URL_PARAMS:sslMode=VERIFY_IDENTITY}
    username: ${DB_USER:user-service-user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect


  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    template:
      retry:
        enabled: true

app:
  social:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS} # Client IDs autorisés comme audience des ID tokens Google

  jwt:
    issuer: ${JWT_ISSUER:https://auth.kickoffmatchup.fr}
    audience: kickoffmatchup-api
    ttl-seconds: 600
    refresh-ttl-days: 30
    refresh-reuse-leeway-seconds: 10
    # Obligatoires hors profil dev : sans elles, le service refuse de démarrer.
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}

# Documentation de l'API désactivée par défaut, activée par le profil dev.
springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:user_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
  jpa:
    show-sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    fr.kickoffmatchup: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
