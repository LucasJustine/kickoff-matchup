spring:
  application:
    name: auth-server
  config:
    import: optional:file:.env[.properties]

  session:
    store-type: redis
    redis:
      namespace: "kickoffmatchup:session"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:user_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:user-service-user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect


  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

app:
  social:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS} # Client IDs autorisés comme audience des ID tokens Google
      
  jwt:
    issuer: ${JWT_ISSUER:https://auth.kickoffmatchup.fr}
    audience: kickoffmatchup-api
    ttl-seconds: 600
    refresh-ttl-days: 30
    refresh-reuse-leeway-seconds: 10
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}

springdoc:
  default-produces-media-type: application/json

  
logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true

logging:
  level:
    fr.kickoffmatchup: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE