server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: auth-server
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  session:
    store-type: redis
    redis:
      namespace: "kickoffmatchup:session"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:user_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:user-service-user}
    password: ${DB_PASSWORD:user-service-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect


  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025} # ex. Mailpit en local
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

app:
  cookie-secure: ${COOKIE_SECURE:false}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  
  mail:
    from: ${MAIL_FROM:no-reply@kickoffmatchup.fr}
    
  social:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:} # Client IDs autorisés comme audience des ID tokens Google
      
  jwt:
    issuer: ${JWT_ISSUER:https://auth.kickoffmatchup.fr}
    audience: kickoffmatchup-api
    ttl-seconds: 600
    refresh-ttl-days: 30
    refresh-reuse-leeway-seconds: 10
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}